name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Snake Rainbow
        shell: python
        run: |
          import re

          files = [
              "dist/github-snake.svg",
              "dist/github-snake-dark.svg"
          ]

          colors = [
              "#ff0000",
              "#ff7f00",
              "#ffff00",
              "#00ff00",
              "#00ffff",
              "#0080ff",
              "#0000ff",
              "#8b00ff"
          ]

          for filename in files:
              with open(filename, "r", encoding="utf-8") as f:
                  svg = f.read()

              gradient = """
              <defs>
                <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#ff0000"/>
                  <stop offset="14%" stop-color="#ff7f00"/>
                  <stop offset="28%" stop-color="#ffff00"/>
                  <stop offset="42%" stop-color="#00ff00"/>
                  <stop offset="57%" stop-color="#00ffff"/>
                  <stop offset="71%" stop-color="#0080ff"/>
                  <stop offset="85%" stop-color="#0000ff"/>
                  <stop offset="100%" stop-color="#8b00ff"/>
                </linearGradient>
              </defs>
              """

              svg = svg.replace("<svg", gradient + "<svg", 1)

              svg = re.sub(
                  r'fill="[^"]*"',
                  'fill="url(#rainbow)"',
                  svg
              )

              with open(filename, "w", encoding="utf-8") as f:
                  f.write(svg)

      - name: Deploy Snake to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution snake"
